## ═══════════════════════════════════════════════════════════════
## openvibe.deals — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.deals.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4840, systemd unit openvibe-deals) renders every page;
## nginx terminates TLS, redirects www → apex, rate-limits auth, forms and API, keeps the events
## webhook host-local, and compresses text. The abuse controls read the client IP from
## X-Forwarded-For (TRUST_PROXY=2 behind Cloudflare → nginx).
##
## No proxy_cache here on purpose: the app decides cacheability per response (Cache-Control
## public, max-age=60 only for pages shown to anonymous visitors — freshness labels are computed
## at render time, so a longer cache would show "fresh" for longer than it is true; private,
## no-store for everything else, Vary: Cookie, Authorization).
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovdeals_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovdeals_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovdeals_write:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.deals www.openvibe.deals;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.deals$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.deals;

    ssl_certificate     /etc/letsencrypt/live/openvibe.deals/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.deals/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.deals$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.deals;

    ssl_certificate     /etc/letsencrypt/live/openvibe.deals/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.deals/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.deals.access.log;
    error_log  /var/log/nginx/openvibe.deals.error.log;

    # Forms are URL-encoded and small; there are no uploads.
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/feed+json image/svg+xml text/plain application/xml text/xml application/rss+xml application/atom+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    location /auth/ {
        limit_req zone=ovdeals_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4840;
    }

    # ── Forms (submit, watches, moderation) ─────────────────
    location ~ ^/(submit|watches|mod)(/|$) {
        limit_req zone=ovdeals_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4840;
    }

    # ── OpenVibe.Events deliveries come from the host (127.0.0.1:4840/internal/events), never from the internet ──
    location /internal/ { return 404; }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovdeals_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4840;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4840/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, feeds, sitemaps, robots.txt, llms.txt, static assets ──
    location / {
        proxy_pass http://127.0.0.1:4840;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
